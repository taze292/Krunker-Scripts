function syntax(source,lang){if(lang==='Text')return e(source);const re=/(\/\/[^\n]*|\/(?:\*[^]*?\*\/)|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|\x60(?:\\.|[^\x60\\])*\x60|\b(?:const|let|var|function|return|if|else|throw|new|true|false|null|undefined|async|await|typeof|class|try|catch|for|of)\b|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b|[{}()[\].,;:?=><!+*|&-])/g;let result='',last=0;for(const m of String(source).matchAll(re)){result+=e(source.slice(last,m.index));const Token=m[0],Tail=source.slice(m.index+Token.length);let Kind='punctuation';if(Token.startsWith('//')||Token.startsWith('/*'))Kind='comment';else if(/^['"\x60]/.test(Token))Kind='string';else if(/^(?:const|let|var|function|return|if|else|throw|new|true|false|null|undefined|async|await|typeof|class|try|catch|for|of)$/.test(Token))Kind='keyword';else if(/^\d/.test(Token))Kind='number';else if(/^[A-Za-z_$]/.test(Token))Kind=/^\s*\(/.test(Tail)?'function':/^[A-Z]/.test(Token)?'variable':'property';result+='<span class="token-'+Kind+'">'+e(Token)+'</span>';last=m.index+Token.length;}return result+e(source.slice(last));}
function code(source,lang='JavaScript'){return '<div class="code-block"><div class="code-header"><span>'+e(lang)+'</span><button class="copy" type="button" aria-label="Copy code">'+icon('copy')+'<span>Copy</span></button></div><pre><code>'+syntax(String(source),lang)+'</code></pre></div>';}
function note(s){return '<div class="info">'+icon('info')+'<div>'+s+'</div></div>';}
function table(headers,rows,cl=''){return '<div class="table-wrap"><table class="'+cl+'"><thead><tr>'+headers.map(h=>'<th>'+e(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function evidence(ev){if(!ev)return '';return '<details><summary>Source evidence</summary><div>'+code(JSON.stringify(ev,null,2),'JSON')+'</div></details>';}
function crumb(items){return '<div class="breadcrumb">'+items.map(([title,url])=>url?'<a href="#'+url+'">'+e(title)+'</a>':e(title)).join('<span>›</span>')+'</div>';}
function nav(route){const [section,member]=route.split('/');$('navigation').innerHTML=groups.map(([label,items])=>(label?'<div class="nav-label">'+label+'</div>':'')+items.map(([id,title,ic])=>{const s=byId[id],active=id===section;return '<a href="#'+id+'" class="nav-row '+(active?'active':'')+'">'+icon(ic)+'<span>'+e(title)+'</span>'+(s?.obj.methods.length?'<span class="chevron">'+icon('chevron')+'</span>':'')+'</a>'+(s&&active&&s.obj.methods.length?'<div class="nav-children">'+s.obj.methods.map(m=>'<a class="nav-child '+(member===m.name?'active':'')+'" href="#'+id+'/'+encodeURIComponent(m.name)+'">'+e(m.name)+'</a>').join('')+'</div>':'');}).join('')).join('');}
const description={sdk:'Load the shared bridge and access the real game, players and controls.',players:'Find players, inspect the roster, and work with player simulation and weapon helpers.',player:'Position, movement, health, loadout and rendering state on an individual player.',weapons:'Weapon definitions, ammunition settings, timing, damage and presentation.',controls:'Bindings, key state, mouse input, camera controls and input simulation.', 'script-players':'The player collection exposed to custom-game scripts.','script-player':'The player view supplied to custom-game scripts.',browser:'Functions explicitly exported on the browser window.',sound:'Sound playback, spatial audio, volumes and cached audio handles.',gui:'The small browser-facing GUI object.', 'end-screen':'End-of-match GUI controls.',socket:'Connection lifecycle, events and the game’s binary transport.'};
function intro(){return '<h1>Introduction</h1>'+p('Documentation for Krunker’s client objects and scripting interfaces.')+p('Find player state, controls, weapon helpers and browser functions, with signatures and examples for the captured client build.')+p('Use the sidebar to browse a category, or search for a function or property.')+note('This reference describes a captured client build. Internal names and access paths can change when the game updates.')+'<hr>'+heading('Explore the Docs','explore')+'<div class="cards">'+spec.filter(s=>!['gui','end-screen'].includes(s.id)).map(s=>'<a class="card" href="#'+s.id+'"><b>'+e(s.title)+'</b><span>'+e(description[s.id])+'</span></a>').join('')+'<a class="card" href="#getting-started"><b>Getting started</b><span>Access captured game references and use them in a userscript.</span></a><a class="card" href="#examples"><b>Examples</b><span>Read player names, inspect positions and combine client functions.</span></a></div><div class="downloads"><a class="link" href="../SDK.js">SDK.js</a><a class="link" href="../SDK.js">SDK.js</a><a class="link" href="Krunker-Client-API.json">API reference JSON</a><a class="link" href="Krunker-API-Explorer.user.js">API explorer userscript</a></div>';}
function gettingStarted(){return '<h1>Getting started</h1><p class="subtitle">Load the shared SDK, then use it from your scripts.</p>'+heading('Load SDK.js','load-sdk')+p('SDK.js is a plain browser JavaScript library. Load it in the page context before the game initializes. For Tampermonkey, use it as an @require dependency with @run-at document-start, @sandbox raw and @grant none.')+p('Host the file at a URL your userscript manager can read, or serve it locally while developing. A plain SDK.js file is not a complete Tampermonkey userscript by itself.')+'<p><a class="link" href="../SDK.js">Download SDK.js</a></p>'+note('<strong>Load the first copy early.</strong> SDK.js observes client initialization. A first load after startup cannot reveal existing closure variables. After the SDK has initialized, other scripts can consume it at any time.')+heading('Wait for the SDK','ready')+code('const SDK = await window.KrunkerSDK.Ready;\nconst Game = SDK.Game;\nconst Players = SDK.Players;\nconst Controls = SDK.Controls;\n\nSDK.Log(SDK.GetPlayerNames());')+p('Use await inside an async function, a module, or the browser console. For a regular script, use the shared promise directly:')+code('window.KrunkerSDK.Ready.then(SDK => {\n    SDK.Log(SDK.GetPlayerNames());\n}).catch(Error => {\n    window.KrunkerSDK.Log(Error);\n});')+heading('Shared across scripts','shared')+p('Repeated SDK loads reuse window.KrunkerSDK and its Ready promise. Loading a second consumer does not install another initialization observer. Players, Controls and LocalPlayer read the current game references when accessed.')+p('SDK members use PascalCase. The objects returned by the game retain their original case-sensitive properties, such as Players.list and Player.name.')+heading('Player names','names')+code('const SDK = await window.KrunkerSDK.Ready;\nconst Names = SDK.Players.list\n    .filter(Boolean)\n    .map(Player => Player.name);\n\nSDK.Log(Names);')+heading('Client and server state','state')+p('Ready means the game objects are available. It does not mean a match has started or a local player has spawned. Read the conditions on each gameplay helper before using it.')+heading('Verification','verification')+p('The capture mechanism was verified against the real client at document start. Object identity and restoration of the original property-definition function are checked separately from player-roster behavior. The Tampermonkey extension itself has not been tested end to end.');}
function objectPage(s){const o=s.obj;let html=crumb([['Docs','introduction'],[s.title]])+'<h1>'+e(s.title)+'</h1><p class="subtitle">'+e(description[s.id])+'</p>';html+=heading('Overview','overview')+p(o.description||'');html+=note((s.id==='sdk'||s.id==='sdk'||s.id==='browser'||s.id==='sound'||s.id==='gui'||s.id==='end-screen')?'This interface is explicitly exported on the browser window. Initialization and per-function conditions still apply.':'This interface requires a real instance reference. See <a class="link" href="#getting-started">Getting started</a> for the access path.');if(o.fields?.length){html+=heading('Properties','properties')+table(['Property','Type','Description'],o.fields.map(f=>['<span id="field-'+e(f.name)+'">'+inline(f.name)+'</span>',inline(f.type||'unknown'),e(f.description||'')]));}if(o.methods?.length){html+=heading('Available Functions','functions')+table(['Function','Description'],o.methods.map(m=>['<a href="#'+s.id+'/'+encodeURIComponent(m.name)+'">'+inline(m.name)+'</a>',e(m.description||'')]),'method-list');}return html;}
function methodPage(s,m){let html=crumb([['Docs','introduction'],[s.title,s.id],[m.name]])+'<h1>'+e(m.name)+'</h1>'+p(m.description||'');html+=heading('Definition','definition')+code(s.root+'.'+(m.signature||m.name+'(...)'));if(m.parameters){html+=heading('Parameters','parameters')+code(text(m.parameters),'JSON');}html+=heading('Returns','returns')+'<p class="return-value">'+e(m.returns||'Unresolved')+'</p>';if(m.conditions?.length){html+=heading('Conditions','conditions')+'<ul class="conditions">'+m.conditions.map(c=>'<li>'+e(c)+'</li>').join('')+'</ul>';}if(m.raw_parameter_identifiers?.length){html+='<p class="small">Descriptive parameter names are inferred from the source. The original identifiers are preserved in the evidence.</p>';}if(m.runtimeDescriptor){html+='<p class="small">The browser property’s presence and declared argument count were checked on the menu.</p>';}html+=heading('Evidence','source')+evidence(m.evidence);return html;}
function examples(){return '<h1>Examples</h1><p class="subtitle">Combine client functions for a specific task.</p>'+note('Internal examples require the real instance references described in <a class="link" href="#getting-started">Getting started</a>. They are not standalone global APIs.')+D.recipes.map((r,i)=>heading(r.name||'Example','example-'+i)+(r.access?p(r.access):'')+(r.requires?'<p class="small">Requires: '+e(r.requires.join('; '))+'</p>':'')+(r.steps?'<ol>'+r.steps.map(s=>'<li>'+e(s)+'</li>').join('')+'</ol>':'')+(r.code?code(r.code):'')+(r.conditions?'<ul class="conditions">'+r.conditions.map(c=>'<li>'+e(c)+'</li>').join('')+'</ul>':'')+(r.limits?'<p class="small">'+e(text(r.limits))+'</p>':'')).join('');}

function lifecycle(){return '<h1>Lifecycle</h1><p class="subtitle">Frame updates, script callbacks and game networking.</p>'+heading('Frame order','frame')+code('controls.updateMouseInp()\ncontrols.update(delta)\n// sample input, predict movement, batch network inputs\ngame.update(delta, now, localPlayer)\nHUD.render(...)\nmainScript.render(delta) // custom-game callback, when present','Text')+heading('Frame details','details')+code(text(D.lifecycle.frame),'JSON')+heading('Game update','update')+code(text(D.lifecycle.gameUpdate),'JSON')+heading('Custom-game callbacks','callbacks')+code(text(D.lifecycle.customGameScriptHooks),'JSON')+p(D.lifecycle.instrumentationConclusion)+heading('Transport','transport')+code(text(D.networkTransport),'JSON')+heading('Event routing','routing')+code(text(D.networkRouting),'JSON')+heading('Join flow','join')+code(text(D.joinFlow),'JSON');}
function globals(name){const g=D.globals.find(x=>x.name===name);if(name&&g)return crumb([['Docs','introduction'],['Global index','globals'],[name]])+'<h1>'+e(name)+'</h1>'+p('Literal browser-global assignment found in the captured client. This inventory entry does not by itself establish a supported behavioral contract.')+heading('Browser observation','observation')+code(text(g.runtime),'JSON')+heading('Assignments','assignments')+g.assignments.map(a=>'<p class="small">Original UTF-16 offset: '+e(a.originalUtf16Offset)+' · UTF-8 byte offset: '+e(a.originalUtf8ByteOffset)+'</p>'+code(a.rhsPreview||a.preview||'','JavaScript')).join('');return '<h1>Global index</h1><p class="subtitle">Literal browser exports found in the captured client.</p>'+p('This inventory includes '+D.globals.length+' unique names. Curated function pages provide the behavioral contracts; index entries preserve source assignments and menu observations.')+heading('Browser globals','all')+table(['Name','Menu observation','Declared arguments'],D.globals.map(g=>['<a href="#globals/'+encodeURIComponent(g.name)+'">'+inline(g.name)+'</a>',e(g.runtime.state==='data-property'?g.runtime.type:g.runtime.state),g.runtime.functionArity==null?'—':e(g.runtime.functionArity)]));}
function coverage(){return '<h1>Evidence & coverage</h1><p class="subtitle">How this reference was produced and what was verified.</p>'+heading('Captured source','source')+p('Build: '+D.build)+p('Captured '+D.captureLocal+'. Original JavaScript SHA-256:')+code(D.sourceSha256,'Text')+heading('Verification','verification')+p('Member definitions and call paths were inspected in the captured source. Browser-global availability was checked using own-property descriptors without invoking getters or gameplay functions.')+p('The later KrunkerSDK test verified the real game, player manager and controls references. Its temporary Object.defineProperty observer was restored and the original tmpPlayer getter descriptor was preserved.')+heading('Source locations','locations')+p('Original offsets refer to the captured source. Normalized offsets refer to a separate string-substituted reading copy. These locations are kept in the per-function evidence and JSON reference.')+heading('Limits','limits')+'<ul>'+D.limits.map(l=>'<li>'+e(l)+'</li>').join('')+heading('Downloads','downloads')+'<p><a class="link" href="Krunker-Client-API.json">Machine-readable API reference</a></p><p><a class="link" href="Krunker-API-Explorer.user.js">API explorer userscript</a></p>';}
function footer(route){const order=groups.flatMap(g=>g[1]).flatMap(item=>[item,...(byId[item[0]]?.obj.methods||[]).map(m=>[item[0]+'/'+encodeURIComponent(m.name),m.name])]),idx=order.findIndex(x=>x[0]===route);const prev=order[idx-1],next=order[idx+1];return '<div class="page-footer">'+(prev?'<a href="#'+prev[0]+'"><span>Previous Page</span>← '+e(prev[1])+'</a>':'<span></span>')+(next?'<a href="#'+next[0]+'" style="text-align:right"><span>Next Page</span>'+e(next[1])+' →</a>':'')+'</div><div class="source-note">Krunker client documentation · Captured build OpCIg</div>';}
function render(){let [route,anchor]=(location.hash.slice(1)||'introduction').split('~');let [id,...rest]=route.split('/');const name=decodeURIComponent(rest.join('/'));headings=[];currentRoute=route;let html;const s=byId[id];if(s){const method=s.obj.methods.find(m=>m.name===name);html=method?methodPage(s,method):objectPage(s);document.title=(method?method.name:s.title)+' · Krunker Docs';}else{switch(id){case'getting-started':html=gettingStarted();break;case'examples':html=examples();break;case'input':html=input();break;case'lifecycle':html=lifecycle();break;case'globals':html=globals(name);break;case'evidence':html=coverage();break;default:id='introduction';route=id;currentRoute=id;html=intro();}document.title=(groups.flatMap(g=>g[1]).find(x=>x[0]===id)?.[1]||'Documentation')+' · Krunker Docs';}nav(route);$('content').innerHTML=html+footer(route);$('toc').innerHTML='<div class="title">'+icon('list')+'On this page</div><div>'+headings.map(h=>'<a href="#'+route+'~'+h.id+'">'+e(h.title)+'</a>').join('')+'</div>';document.body.classList.remove('nav-open');requestAnimationFrame(()=>{if(anchor)document.getElementById(anchor)?.scrollIntoView({behavior:'instant',block:'start'});else window.scrollTo({top:0,behavior:'instant'});});}
const searchIndex=[{title:'Introduction',description:'Explore the documentation',route:'introduction'},{title:'Getting started',description:'Load SDK.js and access shared game, players and controls',route:'getting-started'},{title:'Examples',description:'Player list, positions and firing input recipes',route:'examples'}];for(const s of spec){searchIndex.push({title:s.title,description:description[s.id],route:s.id});for(const m of s.obj.methods)searchIndex.push({title:m.name,description:s.title+' · '+(m.description||''),route:s.id+'/'+encodeURIComponent(m.name)});for(const f of s.obj.fields)searchIndex.push({title:f.name,description:s.title+' · '+(f.description||''),route:s.id+'~field-'+f.name});}for(const g of D.globals)searchIndex.push({title:g.name,description:'Browser global · '+(g.runtime.type||g.runtime.state),route:'globals/'+encodeURIComponent(g.name)});
function search(){const words=$('search-input').value.toLowerCase().trim().split(/\s+/).filter(Boolean);const list=words.length?searchIndex.filter(x=>words.every(w=>(x.title+' '+x.description).toLowerCase().includes(w))).sort((a,b)=>Number(b.title.toLowerCase()===words.join(' '))-Number(a.title.toLowerCase()===words.join(' '))).slice(0,25):searchIndex.slice(0,8);$('search-results').innerHTML=list.length?list.map(x=>'<a class="search-result" href="#'+e(x.route)+'"><b>'+e(x.title)+'</b><span>'+e(x.description.slice(0,170))+'</span></a>').join(''):'<div class="empty">No results found.</div>';}
function openSearch(){$('search-dialog').showModal();$('search-input').value='';search();$('search-input').focus();}function closeSearch(){$('search-dialog').close();}
$('search-icon').innerHTML=icon('search');$('modal-search-icon').innerHTML=icon('search');$('search-open').onclick=openSearch;$('search-close').onclick=closeSearch;$('search-input').addEventListener('input',search);$('search-results').addEventListener('click',ev=>{if(ev.target.closest('a'))closeSearch();});$('search-dialog').addEventListener('click',ev=>{if(ev.target===$('search-dialog'))closeSearch();});$('mobile-toggle').onclick=()=>document.body.classList.toggle('nav-open');document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();$('search-dialog').open?closeSearch():openSearch();}});document.addEventListener('click',async ev=>{const button=ev.target.closest('.copy');if(!button)return;const source=button.closest('.code-block').querySelector('code').textContent;try{await navigator.clipboard.writeText(source);button.querySelector('span').textContent='Copied';setTimeout(()=>button.querySelector('span').textContent='Copy',1400);}catch{button.querySelector('span').textContent='Select code';}});window.addEventListener('hashchange',render);render();
</script></body></html>
